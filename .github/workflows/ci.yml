name: Node.js CI
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: docker
    container: node:24-krypton
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install
      - name: Test
        run: pnpm test
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false
      - name: Type check
        run: pnpm run type-check
